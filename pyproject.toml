[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeguard-ai"
version = "0.1.0"
description = "Explainable cross-border counterparty and transaction risk platform"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "joblib>=1.3,<2.0",
  "numpy>=1.26,<2.1",
  "pydantic-settings>=2.5,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "python-multipart>=0.0.12,<1.0",
  "reportlab>=4.0,<5.0",
  "scikit-learn>=1.4,<1.7",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "pypdf>=5.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["backend/app"]
