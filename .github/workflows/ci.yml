name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ml.scripts.generate_synthetic_data
      - run: python -m ml.scripts.train_models
      - run: python -m pytest --cov=backend.app --cov-report=term --cov-fail-under=85
      - name: Validate migrations
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          alembic upgrade head
          alembic check
