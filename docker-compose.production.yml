services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${TRADEGUARD_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://tradeguard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/tradeguard
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?set INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      UPLOAD_DIR: /app/uploads
    volumes:
      - tradeguard_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradeguard
      POSTGRES_USER: tradeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - tradeguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeguard -d tradeguard"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  tradeguard_pgdata:
  tradeguard_uploads:
